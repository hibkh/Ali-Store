<style>
:root{--bg:#f4f5fa;--card:#fff;--line:#e6e8f2;--tx:#1b2036;--mu:#6c7493;--gold:#f5c04a;--gold2:#c98d12;--ok:#12a77a;--bad:#e5484d;--warn:#e8730c;--inp:#f6f7fb;--nav:rgba(255,255,255,.96);

.pg{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.pc{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card);box-shadow:0 4px 16px rgba(20,25,60,.06)}.pi{height:84px;display:flex;align-items:center;justify-content:center;font-size:2.3rem;background:linear-gradient(135deg,#fff4d6,#ffe1a0)}.pb{padding:10px}.pb b{display:block;font-size:.9rem;line-height:1.3;min-height:2.6em}.pp{color:#b8860b;font-weight:800}.chip{font-size:.72rem;padding:1px 9px;border-radius:20px;background:rgba(120,130,170,.14)}

:root{--bg:#f3f3ec;--card:#fff;--line:#e3e6e1;--tx:#1b4a63;--mu:#7d8f98;--gold:#fcd462;--gold2:#f2c13f;--ok:#2f9e6b;--bad:#d64545;--warn:#d98a1c;--inp:#f7f7f2;--nav:#1b4a63}

input,select{border-radius:14px}
nav{background:var(--nav);border-top:0}nav button{color:#cfe0e8}nav button.on{background:var(--gold);color:#1b4a63}nav .logo{display:none}
.pi{background:#f5e6bf}
.hm{display:grid;gap:12px;grid-template-columns:1fr}

.t1{background:#a8e0bd}.t2{background:#f5e6bf}.t0{background:repeating-linear-gradient(135deg,#e7e8e1 0 4px,#f3f3ee 4px 8px);color:#8a9aa3}
.dnw{display:flex;align-items:center;gap:16px;flex-wrap:wrap}

#rep{padding:0;width:860px}
#rep .rh{background:#1b4a63;color:#fff;padding:24px 28px;display:flex;justify-content:space-between;align-items:center}
#rep .rt{font-size:1.9rem;font-weight:800;color:#fcd462}

#rep .ft{padding:6px 28px 22px;color:#8a979e;font-size:.75rem}
.pi{position:relative;height:110px;overflow:hidden}.pi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tl{min-height:100px}.ti{width:46px;height:46px;border-radius:12px;object-fit:cover;margin-bottom:2px}
.html,body{}
html,body{overflow-x:hidden;max-width:100%}
.hm{grid-template-columns:minmax(0,1fr)}.hm>*{min-width:0}
nav{height:calc(66px + env(safe-area-inset-bottom,0px));align-items:stretch}nav button{flex:1 0 58px;min-height:54px;justify-content:center}

.tdl{background:rgba(207,199,227,.35);color:#9a8bd6}#rep .bd.dl{background:#e4def4;color:#5b4c9a}
.tag.pdy{background:rgba(52,211,153,.15);color:var(--ok)}.tag.pdn{background:rgba(248,113,113,.16);color:var(--bad)}.tag.pdp{background:rgba(251,146,60,.18);color:var(--warn)}
#rep .rk{grid-template-columns:repeat(3,1fr)}
.seg{display:flex;gap:6px}.seg button{flex:1;border:1px solid var(--line);padding:11px 6px;border-radius:12px;color:var(--tx)}.seg button.on{background:var(--gold);color:#1b4a63;border-color:var(--gold)}

<body>
<div class="wrap"><header><div><h1>ALI Store 👑🌝</h1><p>إدارة المنتجات والمخزون • <span id="sst">...</span></p></div><button id="inst" class="sun" data-a="inst" hidden title="تثبيت التطبيق" style="font-size:1rem;margin-inline-start:auto;margin-inline-end:8px">📲</button><button id="th" class="sun" title="الوضع">🌙</button></header><div id="view"></div></div>
<nav id="nav"></nav><div id="rep"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const TABS={home:['🏠','الرئيسية'],products:['📦','المنتجات'],buy:['📥','شراء'],deliver:['🚚','تسليم'],sell:['💸','بيع'],stock:['🏬','المخزون'],people:['👥','الأشخاص'],finance:['💼','المالية'],reports:['📑','التقارير'],settings:['⚙️','الإعدادات']};
let S={products:[],moves:[]},tab='home',dl=null,edit=null,force=false,lastBuyer='',lastSeller='';
let R={mode:'all',day:'',mon:'',per:'',pid:'',type:''};
const K='alistore_v2';
try{S=JSON.parse(localStorage.getItem(K)||'null')||S}catch(e){}
S.people=S.people||[];S.rate=S.rate||0;S.disp=S.disp||'SYP';
try{ if(!S.products.length&&!S.moves.length){const o=JSON.parse(localStorage.getItem('alistore_v1')||'[]');
 o.forEach(e=>{let p=S.products.find(x=>x.n===e.i);if(!p){p={id:'p'+Math.random().toString(36).slice(2),n:e.i,c:e.u,s:0};S.products.push(p)}
 S.moves.push({id:'m'+Math.random().toString(36).slice(2),t:'in',d:e.d,pid:p.id,q:e.q,u:e.u,p:e.p})})}}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){};queueSync()};
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const f=n=>Math.round(n).toLocaleString('en-US');
let NR=0;
const cur=x=>x.cur||'SYP';
const IM={},pend=[];let idb=null;
const idbOpen=()=>new Promise(r=>{try{const q=indexedDB.open('alistore',1);q.onupgradeneeded=()=>q.result.createObjectStore('img');q.onsuccess=()=>{idb=q.result;r(idb)};q.onerror=()=>r(null)}catch(e){r(null)}});
const idbPut=(k,v)=>{if(idb){try{idb.transaction('img','readwrite').objectStore('img').put(v,k)}catch(e){}}else pend.push([k,v])};
const idbAll=()=>new Promise(r=>{if(!idb)return r();try{const c=idb.transaction('img').objectStore('img').openCursor();c.onsuccess=()=>{const x=c.result;if(x){if(!IM[x.key]||!String(IM[x.key]).startsWith('data:'))IM[x.key]=x.value;x.continue()}else r()};c.onerror=()=>r()}catch(e){r()}});
let UQ=[];try{UQ=JSON.parse(localStorage.getItem('alistore_upq')||'[]')}catch(e){}
const saveUQ=()=>{try{localStorage.setItem('alistore_upq',JSON.stringify(UQ))}catch(e){}};
const queueImg=id=>{if(!UQ.includes(id))UQ.push(id);saveUQ()};
const ext=()=>{S.products.forEach(p=>{
 if(p.img&&p.img.startsWith('data:')){IM[p.id]=p.img;idbPut(p.id,p.img);p.img='images/'+p.id+'.jpg';p.iv=Date.now();queueImg(p.id)}
 if(p.img&&!String(IM[p.id]||'').startsWith('data:'))IM[p.id]=p.img+(p.iv?'?v='+p.iv:'');
})};
const withImg=()=>({...S,products:S.products.map(p=>({...p,img:IM[p.id]||p.img||''}))});
ext();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
const ld=(id,t)=>S.moves.filter(x=>x.pid===id&&x.t===t).map(x=>x.d).sort().pop()||'—';
const rimg=f=>new Promise(res=>{if(!f)return res('');const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,360/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};i.onerror=()=>res('');i.src=r.result};r.onerror=()=>res('');r.readAsDataURL(f)});
const cv=(v,c)=>{const d=S.disp;if(c===d)return v;if(!S.rate){NR=1;return 0}return d==='USD'?v/S.rate:v*S.rate};
const mf=(v,d)=>{d=d||S.disp;const s=v<0?'-':'';v=Math.abs(v);return s+(d==='USD'?'$'+(Math.round(v*100)/100).toLocaleString('en-US'):f(v)+' ل.س')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
R.day=today();R.mon=today().slice(0,7);
const P=id=>S.products.find(p=>p.id===id);
const pname=id=>P(id)?P(id).n:'(محذوف)';
const stockOf=id=>S.moves.reduce((s,m)=>m.pid===id?s+(m.t==='in'?m.q:(m.t==='out'&&m.fp)?0:-m.q):s,0);
const custody=(id,n)=>S.moves.reduce((s,m)=>m.pid===id&&m.p===n?s+(m.t==='dl'?m.q:(m.t==='out'&&m.fp?-m.q:0)):s,0);
const LB={in:'شراء',dl:'تسليم',out:'بيع'};
const pdOf=m=>m.paid===undefined?m.q*m.u:m.paid;
const pst=m=>{if(m.t!=='out')return null;const t=m.q*m.u,p=pdOf(m);return p>=t?['pdy','مقبوض']:p<=0?['pdn','غير مقبوض']:['pdp','جزئي '+f(p)+' / '+f(t)]};
const payTag=m=>{const x=pst(m);return x?`<span class="tag ${x[0]}">${x[1]}</span>`:'—'};
const payLbl=m=>{const x=pst(m);return x?x[1]:'—'};
const people=()=>[...new Set([...(S.people||[]),...S.moves.map(m=>m.p)])].filter(Boolean).sort();
const opts=(arr,sel,all)=>(all?`<option value="">${all}</option>`:'')+arr.map(([v,t])=>`<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(t)}</option>`).join('');
const prodOpts=(sel,withStock)=>S.products.map(p=>[p.id,p.n+(withStock?` — متبقي ${stockOf(p.id)}`:'')]);
const msg=t=>{const m=$('msg');if(m)m.textContent=t};
const card=(h,b)=>`<div class="card">${h?`<h2>${h}</h2>`:''}${b}</div>`;
const noProd=card('','<div class="empty">أضف منتجات أولاً من تبويب 📦 المنتجات</div>');

function movesTable(L,del){
 if(!L.length)return '<div class="empty">لا يوجد بيانات</div>';
 return `<div class="tw"><table><tr><th>التاريخ</th><th>النوع</th><th>المنتج</th><th>الشخص</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th><th>الدفع</th>${del?'<th></th>':''}</tr>`+
 L.map(m=>`<tr><td>${m.d}</td><td><span class="tag t${m.t}">${LB[m.t]}</span></td><td class="n">${esc(pname(m.pid))}</td><td>${esc(m.p||'—')}</td><td>${m.q}</td><td>${mf(m.u,cur(m))}</td><td><b>${mf(m.q*m.u,cur(m))}</b></td><td>${payTag(m)}</td>${del?`<td>${m.t==='out'&&pdOf(m)<m.q*m.u?`<button class="ed" data-a="pay" data-id="${m.id}">قبض</button>`:''}<button class="x" data-a="dm" data-id="${m.id}">✕</button></td>`:''}</tr>`).join('')+'</table></div>';
}
function totals(L){
 const r={bi:0,bo:0,cs:0,pd:0,raw:{USD:{bi:0,bo:0,pd:0},SYP:{bi:0,bo:0,pd:0}}};
 L.forEach(m=>{if(m.t==='dl')return;r.raw[cur(m)][m.t==='in'?'bi':'bo']+=m.q*m.u;if(m.t==='out')r.raw[cur(m)].pd+=pdOf(m);const v=cv(m.q*m.u,cur(m));if(m.t==='in')r.bi+=v;else{r.bo+=v;r.pd+=cv(pdOf(m),cur(m));const p=P(m.pid);r.cs+=p?cv(m.q*p.c,cur(p)):0}});
 r.pr=r.bo-r.cs;return r;
}
const V={};
const balCard=t=>{
 const sv=S.products.reduce((s,p)=>s+Math.max(0,stockOf(p.id))*cv(p.c,cur(p)),0),r=t.raw,net=c=>r[c].pd-r[c].bi,all=cv(net('USD'),'USD')+cv(net('SYP'),'SYP');

V.reports=()=>{
 const L=filt(),t=totals(L);
 return card('🔎 فلترة التقرير',`<div class="row"><div><label>الفترة</label><select data-r="mode">${opts([['all','الكل'],['day','يوم محدد'],['month','شهر محدد']],R.mode)}</select></div>

 <div><label>الشخص</label><select data-r="per">${opts(people().map(x=>[x,x]),R.per,'الكل')}</select></div>
 <div><label>المنتج</label><select data-r="pid">${opts(prodOpts(),R.pid,'الكل')}</select></div>

};
function render(){
 $('nav').innerHTML='<div class="logo">ALI Store 👑🌝</div>'+Object.entries(TABS).map(([k,v])=>`<button data-tab="${k}" class="${k===tab?'on':''}"><span>${v[0]}</span>${v[1]}</button>`).join('');
 $('view').innerHTML=V[tab]();
 if(tab==='reports'&&$('rs'))$('rs').onchange=restore;
 if(!dl&&tab==='reports')document.querySelectorAll('[data-a=img],[data-a=pdf],[data-a=csv],[data-a=bk]').forEach(b=>b.hidden=true);

function go(t){tab=t;edit=null;force=false;try{location.hash=t}catch(e){}render();scrollTo(0,0)}
const armed=b=>{if(b.dataset.c==='1')return true;b.dataset.c='1';const o=b.textContent;b.textContent='تأكيد؟';setTimeout(()=>{b.dataset.c='';b.textContent=o},3000);return false};
document.addEventListener('click',async ev=>{
 const b=ev.target.closest('button');if(!b)return;
 if(b.dataset.tab)return go(b.dataset.tab);
 const a=b.dataset.a,id=b.dataset.id;if(!a)return;
 if(a==='sp'){
  const n=$('pn').value.trim(),c=$('pc').value,s=+$('ps').value||0;
  if(!n||c===''||+c<0)return msg('اكتب الاسم وسعر الشراء');
  const im=await rimg($('pimg').files[0]);
  if(edit){const p=P(edit);p.n=n;p.c=+c;p.s=s;p.cur=$('pcu').value;if(im){IM[p.id]=im;idbPut(p.id,im);p.img='images/'+p.id+'.jpg';p.iv=Date.now();queueImg(p.id)};edit=null}else {const id=uid(),o={id,n,c:+c,s,cur:$('pcu').value};if(im){IM[id]=im;idbPut(id,im);o.img='images/'+id+'.jpg';o.iv=Date.now();queueImg(id)}S.products.push(o)};
  save();render();
 }else if(a==='ep'){edit=id;render();scrollTo(0,0)}
 else if(a==='dp'){if(S.moves.some(m=>m.pid===id))return alertIn(b,'عليه حركات، ما بينحذف');if(armed(b)){S.products=S.products.filter(p=>p.id!==id);save();render()}}
 else if(a==='pm'){$('mpd').value=b.dataset.v;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));$('mpw').hidden=b.dataset.v!=='part'}else if(a==='sp2'){lastSeller=id;go('sell')}else if(a==='pay'){const m=S.moves.find(x=>String(x.id)===id);if(m){m.paid=m.q*m.u;save();render()}}else if(a==='dm'){if(armed(b)){S.moves=S.moves.filter(m=>m.id!==id);save();render()}}
 else if(a==='sm'){
  const t=b.dataset.t,pid=$('mp').value,q=+$('mq').value,u=$('mu').value,w=$('mw')?$('mw').value.trim():'',d=$('md').value||today();
  if(!pid||!(q>0)||(u===''&&t!=='dl')||+u<0||(t==='dl'&&!w))return msg('عبّي كل الحقول (مع اسم المستلم)');
  const av=(t==='out'&&w)?custody(pid,w):stockOf(pid);if(t!=='in'&&q>av&&!force){force=true;return msg('الكمية أكبر من المتاح ('+av+'). اضغط تسجيل مرة ثانية للتأكيد')}
  if(w&&!people().includes(w))S.people.push(w);const cu=$('mcu').value,pm=$('mpd')?$('mpd').value:'full',payAmt=tot=>pm==='none'?0:pm==='part'?Math.min(tot,+$('mpa').value||0):tot;S.moves.push({id:uid(),t,d,pid,q,u:+u,p:w,cur:cu,fp:(t==='out'&&w)?w:'',...(t==='out'?{paid:payAmt(q*+u)}:{})});if(t==='in'){P(pid).c=+u;P(pid).cur=cu;lastBuyer=w}else lastSeller=w;
  force=false;save();render();msg('تم التسجيل ✅');
 }else if(a==='ap'){const n=$('np').value.trim();if(!n)return msg('اكتب الاسم');if(people().includes(n))return msg('الاسم موجود مسبقاً');S.people.push(n);save();render()}else if(a==='dpe'){if(armed(b)){S.people=S.people.filter(x=>x!==id);save();render()}}else if(a==='inst'){if(DP){DP.prompt();try{await DP.userChoice}catch(e){}DP=null;const b2=$('inst');if(b2)b2.hidden=true;render()}}else if(a==='gs'){G={o:$('g_o').value.trim(),r:$('g_r').value.trim(),b:$('g_b').value.trim()||'main',p:$('g_p').value.trim()||'data.json',t:$('g_t').value.trim()};try{localStorage.setItem(GK,JSON.stringify(G))}catch(e){}sha=null;msg('جاري الاتصال…');await pull();msg(st)}else if(a==='gp'){sha=null;await pull();msg(st)}else if(a==='gu'){await push();msg(st)}else if(a==='img'){const c=await snap();if(c)c.toBlob(x=>out('ALI-Store-'+stamp()+'.png',x))}
 else if(a==='pdf'){
  const c=await snap();if(!c)return;const {jsPDF}=window.jspdf,pdf=new jsPDF('p','mm','a4'),W=210,H=297,ih=c.height*W/c.width,img=c.toDataURL('image/jpeg',.92);
  let y=0;pdf.addImage(img,'JPEG',0,0,W,ih);while(ih-(y+=H)>1){pdf.addPage();pdf.addImage(img,'JPEG',0,-y,W,ih)}
  out('ALI-Store-'+stamp()+'.pdf',pdf.output('blob'));
 }else if(a==='csv'){
  const L=filt();if(!L.length)return msg('ما في بيانات');
  out('ALI-Store-'+stamp()+'.csv','\ufeff'+['التاريخ,النوع,المنتج,الشخص,الكمية,السعر,الإجمالي,العملة,الدفع',...L.map(m=>[m.d,LB[m.t],pname(m.pid),m.p,m.q,m.u,m.q*m.u,cur(m),payLbl(m)].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','))].join('\n'));
 }else if(a==='bk')out('ALI-Store-backup-'+today()+'.json',JSON.stringify(withImg()));
});
const alertIn=(b,t)=>{const o=b.textContent;b.textContent=t;setTimeout(()=>b.textContent=o,2000)};
document.addEventListener('change',ev=>{
 const t=ev.target;
 if(t.dataset.r){R[t.dataset.r]=t.value;render();return}
 if(t.id==='mpd'){$('mpw').hidden=t.value!=='part';return}
 if(t.id==='mp'){const p=P(t.value);$('mu').value=tab==='buy'?p.c:(p.s||'');$('mcu').value=cur(p)}
 if(t.id==='rt'){S.rate=+t.value||0;save();render();return}
 if(t.id==='dp'){S.disp=t.value;save();render();return}
});
function restore(e){
 const fl=e.target.files[0];if(!fl)return;
 fl.text().then(x=>{const o=JSON.parse(x);if(!Array.isArray(o.products)||!Array.isArray(o.moves))throw 0;S=o;ext();S.people=S.people||[];S.rate=S.rate||0;S.disp=S.disp||'SYP';save();render();msg('تمت الاستعادة ✅')}).catch(()=>msg('ملف غير صالح'));
}
const stamp=()=>R.mode==='day'?R.day:R.mode==='month'?R.mon:'all';
function buildRep(){
 const L=filt().reverse();NR=0;const t=totals(L),r=t.raw,by={};
 L.forEach(m=>{if(!m.p||m.t!=='dl')return;const o=by[m.p]=by[m.p]||{i:0,o:0};o.o+=cv(m.q*m.u,cur(m))});
 const rows=L.map((m,i)=>`<tr class="${i%2?'z':''}"><td>${m.d}</td><td><span class="bd ${m.t}">${LB[m.t]}</span></td><td>${esc(pname(m.pid))}</td><td>${esc(m.p||'—')}</td><td class="r">${m.q}</td><td class="r">${mf(m.u,cur(m))}</td><td class="r"><b>${mf(m.q*m.u,cur(m))}</b></td><td>${payLbl(m)}</td></tr>`).join('');
 $('rep').innerHTML=`<div class="rh"><div><div class="rt">ALI Store 👑🌝</div><div>تقرير المشتريات والمبيعات</div></div><div class="rs">${esc(label())}<br>تاريخ التصدير: ${today()}</div></div><div class="rk"><div><b>${mf(t.bi)}</b>إجمالي المشتريات</div><div><b>${mf(t.bo)}</b>إجمالي المبيعات</div><div><b>${mf(t.pd)}</b>مقبوض</div><div><b>${mf(t.bo-t.pd)}</b>غير مقبوض</div><div><b>${mf(t.pd-t.bi)}</b>الرصيد (مقبوض − شراء)</div><div><b>${mf(t.pr)}</b>الربح التقريبي</div></div><table class="rtb"><thead><tr><th>التاريخ</th><th>النوع</th><th>المنتج</th><th>الشخص</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th><th>الدفع</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td colspan="8">مشتريات: ${mf(r.USD.bi,'USD')} + ${mf(r.SYP.bi,'SYP')} &nbsp;|&nbsp; مبيعات: ${mf(r.USD.bo,'USD')} + ${mf(r.SYP.bo,'SYP')} &nbsp;|&nbsp; مقبوض: ${mf(r.USD.pd,'USD')} + ${mf(r.SYP.pd,'SYP')}</td></tr></tfoot></table><table class="rtb"><thead><tr><th>المستلم</th><th>قيمة ما تسلّمه</th></tr></thead><tbody>${Object.entries(by).map(([n,o],i)=>`<tr class="${i%2?'z':''}"><td>${esc(n)}</td><td>${mf(o.o)}</td></tr>`).join('')}</tbody></table><div class="ft">${S.rate?'سعر الصرف: 1$ = '+f(S.rate)+' ل.س • ':''}الأرقام الكلية محسوبة بـ ${S.disp==='USD'?'الدولار':'الليرة'} • ALI Store</div>`;
 return L.length;
}
function buildRepOld(){
 const L=filt().reverse(),t=totals(L);
 $('rep').innerHTML=`<h3>ALI Store 👑🌝</h3><div style="color:#666">تقرير — ${esc(label())}</div><table><tr><th>التاريخ</th><th>النوع</th><th>المنتج</th><th>الشخص</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>${L.map(m=>`<tr><td>${m.d}</td><td>${LB[m.t]}</td><td>${esc(pname(m.pid))}</td><td>${esc(m.p||'—')}</td><td>${m.q}</td><td>${f(m.u)}</td><td>${f(m.q*m.u)}</td></tr>`).join('')}</table>
 <table><tr><th>المشتريات</th><td>${f(t.bi)}</td><th>المبيعات</th><td>${f(t.bo)}</td><th>الربح التقريبي</th><td>${f(t.pr)}</td></tr></table><div style="margin-top:10px;color:#888;font-size:.8rem">تاريخ التصدير: ${today()}</div>`;
 return L.length;

async function snap(){
 if(!buildRep()){msg('ما في بيانات ضمن هذه الفلترة.');return null}
 msg('جاري التجهيز…');await (document.fonts&&document.fonts.ready);
 return html2canvas($('rep'),{scale:1.5,backgroundColor:'#fff'});
}
async function out(name,data){
 const b=data instanceof Blob?data:new Blob([data]),u=URL.createObjectURL(b),a=document.createElement('a');
 a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);msg('تم التنزيل ✅');
}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS[h]&&h!==tab){tab=h;render()}});
{const h=location.hash.slice(1);if(TABS[h])tab=h}
dl=true;
/* ===== GitHub sync ===== */
const GK='alistore_gh';let G={o:'',r:'',b:'main',p:'data.json',t:''},sha=null,st='محلي فقط',tm=null,busy=false;
try{G=Object.assign(G,JSON.parse(localStorage.getItem(GK)||'{}'))}catch(e){}
if(!G.o&&/\.github\.io$/.test(location.hostname)){G.o=location.hostname.split('.')[0];G.r=location.pathname.split('/')[1]||G.o+'.github.io'}
const setSt=t=>{st=t;const e=$('sst');if(e)e.textContent=t};
const ready=()=>G.t&&G.o&&G.r;
const base=()=>`https://api.github.com/repos/${G.o}/${G.r}/contents`;
const fileUrl=()=>base()+'/'+G.p.split('/').map(encodeURIComponent).join('/');
const hd=()=>({Authorization:'Bearer '+G.t,'X-GitHub-Api-Version':'2022-11-28'});
const b64=s=>{const b=new TextEncoder().encode(s);let x='';for(let i=0;i<b.length;i+=8192)x+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(x)};
async function shaOf(){
 const d=G.p.includes('/')?G.p.slice(0,G.p.lastIndexOf('/')):'';
 const r=await fetch(base()+(d?'/'+d:'')+'?ref='+encodeURIComponent(G.b)+'&t='+Date.now(),{headers:hd(),cache:'no-store'});
 if(!r.ok)throw r;const l=await r.json();const f=Array.isArray(l)&&l.find(x=>x.path===G.p);return f?f.sha:null;
}
function adopt(o){
 if(o&&Array.isArray(o.products)&&Array.isArray(o.moves)){
  S=Object.assign({people:[],rate:0,disp:'SYP'},o);ext();
  try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
  if(!document.activeElement||document.activeElement===document.body||tab!=='settings')render();
 }
}
async function pull(){
 if(!ready()){
  if(!S.products.length&&!S.moves.length){try{const r=await fetch(G.p+'?t='+Date.now());if(r.ok){adopt(await r.json());setSt('قراءة فقط — أدخل التوكن من ⚙️ للحفظ')}}catch(e){}}
  else setSt('محلي فقط — أدخل إعدادات GitHub من ⚙️');
  return;
 }
 setSt('جاري التحميل…');
 try{
  sha=await shaOf();
  if(sha){const r=await fetch(fileUrl()+'?ref='+encodeURIComponent(G.b),{headers:{...hd(),Accept:'application/vnd.github.raw+json'},cache:'no-store'});if(!r.ok)throw r;adopt(await r.json())}
  setSt('متصل ✅ '+new Date().toLocaleTimeString('en-GB'));
 }catch(e){setSt(e&&e.status===401?'التوكن غير صحيح':e&&e.status===404?'المستودع أو الفرع غير موجود':'تعذّر الاتصال بـ GitHub')}
}
function queueSync(){
 if(!ready()){setSt('محلي فقط — أدخل إعدادات GitHub من ⚙️');return}
 try{localStorage.setItem('alistore_dirty','1')}catch(e){}
 setSt('تعديلات غير محفوظة…');clearTimeout(tm);tm=setTimeout(push,1500);
}
async function upImgs(){
 for(const id of [...UQ]){
  const d=IM[id],p=P(id);
  if(!p||!d||!String(d).startsWith('data:')){UQ=UQ.filter(x=>x!==id);saveUQ();continue}
  setSt('جاري رفع صورة…');
  const u=base()+'/images/'+id+'.jpg';let sh=null;
  try{const q=await fetch(u+'?ref='+encodeURIComponent(G.b)+'&t='+Date.now(),{headers:hd(),cache:'no-store'});if(q.ok)sh=(await q.json()).sha}catch(e){}
  const body={message:'ALI Store: image '+id,content:d.split(',')[1],branch:G.b};if(sh)body.sha=sh;
  const r=await fetch(u,{method:'PUT',headers:{...hd(),'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw r;
  UQ=UQ.filter(x=>x!==id);saveUQ();
 }
}
async function push(){
 if(!ready())return;
 if(busy){clearTimeout(tm);tm=setTimeout(push,1000);return}
 busy=true;
 try{
  await upImgs();if(!sha)sha=await shaOf();
  const body={message:'ALI Store: update '+new Date().toISOString(),content:b64(JSON.stringify(S,null,1)),branch:G.b};
  if(sha)body.sha=sha;
  const put=()=>fetch(fileUrl(),{method:'PUT',headers:{...hd(),'Content-Type':'application/json'},body:JSON.stringify(body)});
  let r=await put();
  if(r.status===409||r.status===422){sha=await shaOf();if(sha)body.sha=sha;r=await put()}
  if(!r.ok)throw r;
  sha=(await r.json()).content.sha;
  try{localStorage.removeItem('alistore_dirty')}catch(e){}
  setSt('تم الحفظ على GitHub ✅ '+new Date().toLocaleTimeString('en-GB'));
 }catch(e){setSt(e&&e.status===401?'التوكن غير صحيح':e&&e.status===403?'التوكن ما معه صلاحية Contents: write':e&&e.status===404?'المستودع أو الفرع غير موجود':'فشل الحفظ، بيعاد تلقائياً');clearTimeout(tm);tm=setTimeout(push,20000)}
 busy=false;
}
render();
(async()=>{let d=false;try{d=!!localStorage.getItem('alistore_dirty')}catch(e){}if((d||UQ.length)&&ready())await push();else await pull()})();
{const r=document.documentElement;try{const t=localStorage.getItem('alistore_theme');if(t)r.dataset.theme=t}catch(e){}
$('th').textContent=r.dataset.theme==='dark'?'☀️':'🌙';
$('th').onclick=()=>{const d=r.dataset.theme==='dark';r.dataset.theme=d?'light':'dark';$('th').textContent=d?'🌙':'☀️';try{localStorage.setItem('alistore_theme',r.dataset.theme)}catch(e){}}}
idbOpen().then(async()=>{pend.splice(0).forEach(([k,v])=>idbPut(k,v));await idbAll();render();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}});
render();
